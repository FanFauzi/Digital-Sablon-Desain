name: Quality Checks

on:
  push:
    branches:
      - main
      - fix/fabric-canvas-print-area
  pull_request:
    branches:
      - main
      - fix/fabric-canvas-print-area

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify optimized oversized 3D model
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs'

          const modelPath = 'public/models/tshirt-oversized.glb'
          const deprecatedPath = 'public/models/oversized_t-shirt.glb'
          const model = readFileSync(modelPath)

          if (model.length > 1024 * 1024) {
            throw new Error(`Oversized GLB exceeds 1 MiB budget: ${model.length} bytes`)
          }
          if (existsSync(deprecatedPath)) {
            throw new Error('Deprecated 37 MB oversized model must not be reintroduced.')
          }
          if (model.toString('ascii', 0, 4) !== 'glTF') {
            throw new Error('Oversized garment asset is not a valid GLB file.')
          }

          const version = model.readUInt32LE(4)
          const declaredLength = model.readUInt32LE(8)
          const jsonLength = model.readUInt32LE(12)
          const jsonType = model.readUInt32LE(16)

          if (version !== 2 || declaredLength !== model.length || jsonType !== 0x4e4f534a) {
            throw new Error('Oversized GLB header or JSON chunk is invalid.')
          }

          const gltf = JSON.parse(model.toString('utf8', 20, 20 + jsonLength).replace(/\\0+$/, '').trim())
          const meshNames = new Set((gltf.meshes || []).map((mesh) => mesh.name))
          const requiredMeshes = [
            'Garment_Body',
            'Print_Front',
            'Print_Back',
            'Print_LeftSleeve',
            'Print_RightSleeve',
          ]
          const missingMeshes = requiredMeshes.filter((name) => !meshNames.has(name))

          if (missingMeshes.length > 0) {
            throw new Error(`Oversized GLB is missing print surfaces: ${missingMeshes.join(', ')}`)
          }

          console.log(`Validated GLB v${version}: ${model.length} bytes; all 5 garment/print meshes present.`)
          NODE

  backend:
    name: Backend PHPUnit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run backend tests
        run: php artisan test
