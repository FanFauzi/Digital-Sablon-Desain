name: Quality Checks

on:
  push:
    branches:
      - main
      - fix/fabric-canvas-print-area
  pull_request:
    branches:
      - main
      - fix/fabric-canvas-print-area

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify optimized oversized 3D model
        run: |
          model="public/models/tshirt-oversized.glb"
          test -s "$model"
          size=$(wc -c < "$model")
          if [ "$size" -gt 1048576 ]; then
            echo "Oversized model exceeds the 1 MiB asset budget: ${size} bytes"
            exit 1
          fi
          if [ -e "public/models/oversized_t-shirt.glb" ]; then
            echo "Deprecated 37 MB oversized model must not be reintroduced."
            exit 1
          fi
          echo "Oversized GLB size: ${size} bytes (budget: 1048576 bytes)"

  backend:
    name: Backend PHPUnit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run backend tests
        run: php artisan test
